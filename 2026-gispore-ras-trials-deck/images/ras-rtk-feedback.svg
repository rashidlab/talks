<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <!-- Cell gradients -->
    <radialGradient id="cellFill" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#FDFEFE"/>
      <stop offset="60%"  stop-color="#F4F6F8"/>
      <stop offset="100%" stop-color="#DDE3EB"/>
    </radialGradient>
    <radialGradient id="cellFillTreated" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#FDFEFE"/>
      <stop offset="55%"  stop-color="#E8F1FA"/>
      <stop offset="100%" stop-color="#C2D9EC"/>
    </radialGradient>
    <!-- Diffuse RTK glow (radial gradient that fades to transparent) -->
    <radialGradient id="rtkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4B9CD3" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#4B9CD3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4B9CD3" stop-opacity="0"/>
    </radialGradient>
    <!-- Arrowheads -->
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#13294B"/>
    </marker>
    <marker id="arrowDeep" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E6A9F"/>
    </marker>
    <!-- Receptor: a small "T" head atop a stalk; oriented "up" by default
         (anchor point is at the base of the stalk where it meets the membrane) -->
    <symbol id="rtk" overflow="visible">
      <line x1="0" y1="0" x2="0" y2="-10" stroke="#2E6A9F" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="-6" y1="-11" x2="6" y2="-11" stroke="#4B9CD3" stroke-width="3.4" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- ====================================================================
       UNTREATED CELL (left)
       ==================================================================== -->
  <g>
    <text x="120" y="60" text-anchor="middle" font-size="14" fill="#5B6670"
          font-weight="500" letter-spacing="0.08em">UNTREATED</text>

    <!-- Cell body -->
    <ellipse cx="120" cy="190" rx="95" ry="115" fill="url(#cellFill)"
             stroke="#5B6670" stroke-width="2.4"/>

    <!-- RTKs anchored on membrane, oriented outward.
         Rotation = atan2(P.y - C.y, P.x - C.x) + 90, where C = (120, 190).
         Symbol's default stalk points up (-y); rotation aligns stalk with outward normal. -->
    <use href="#rtk" transform="translate(48,160)  rotate(-67)"/>
    <use href="#rtk" transform="translate(58,222)  rotate(-117)"/>
    <use href="#rtk" transform="translate(120,77)  rotate(0)"/>
    <use href="#rtk" transform="translate(120,303) rotate(180)"/>
    <use href="#rtk" transform="translate(190,140) rotate(55)"/>
    <use href="#rtk" transform="translate(187,238) rotate(126)"/>

    <!-- Active RAS-GTP dots — slightly varied sizes for organic feel -->
    <g fill="#C75050">
      <circle cx="93"  cy="161" r="3.8"/>
      <circle cx="111" cy="143" r="3.4"/>
      <circle cx="132" cy="171" r="4.1"/>
      <circle cx="146" cy="154" r="3.5"/>
      <circle cx="99"  cy="196" r="3.9"/>
      <circle cx="126" cy="211" r="3.6"/>
      <circle cx="149" cy="201" r="4.0"/>
      <circle cx="84"  cy="226" r="3.5"/>
      <circle cx="116" cy="236" r="3.8"/>
      <circle cx="142" cy="224" r="3.4"/>
    </g>

    <!-- Inner label -->
    <text x="120" y="278" text-anchor="middle" font-size="11"
          fill="#13294B" font-weight="600">Active RAS-GTP</text>
    <text x="120" y="293" text-anchor="middle" font-size="10" fill="#5B6670"
          font-style="italic">driving proliferation</text>
  </g>

  <!-- ====================================================================
       DARAXONRASIB ARROW (middle)
       ==================================================================== -->
  <g>
    <line x1="225" y1="190" x2="395" y2="190" stroke="#13294B"
          stroke-width="3" marker-end="url(#arrowNavy)"/>
    <rect x="245" y="160" width="130" height="42" rx="7" fill="#13294B"/>
    <text x="310" y="180" text-anchor="middle" font-size="13" fill="#FFFFFF"
          font-weight="600">Daraxonrasib</text>
    <text x="310" y="195" text-anchor="middle" font-size="10" fill="#D6E5F2"
          font-style="italic">RAS(ON) multi-selective</text>
  </g>

  <!-- ====================================================================
       TREATED CELL (right)
       ==================================================================== -->
  <g>
    <text x="600" y="60" text-anchor="middle" font-size="14" fill="#13294B"
          font-weight="500" letter-spacing="0.08em">UNDER DARAXONRASIB</text>

    <!-- Cell body -->
    <ellipse cx="600" cy="190" rx="95" ry="115" fill="url(#cellFillTreated)"
             stroke="#5B6670" stroke-width="2.4"/>

    <!-- Diffuse glow halos behind upregulated RTKs (drawn FIRST so receptors sit on top) -->
    <g>
      <circle cx="528" cy="158"  r="18" fill="url(#rtkGlow)"/>
      <circle cx="538" cy="222"  r="18" fill="url(#rtkGlow)"/>
      <circle cx="600" cy="77"   r="18" fill="url(#rtkGlow)"/>
      <circle cx="600" cy="303"  r="18" fill="url(#rtkGlow)"/>
      <circle cx="670" cy="140"  r="18" fill="url(#rtkGlow)"/>
      <circle cx="667" cy="238"  r="18" fill="url(#rtkGlow)"/>
      <circle cx="538" cy="117"  r="18" fill="url(#rtkGlow)"/>
      <circle cx="582" cy="82"   r="18" fill="url(#rtkGlow)"/>
      <circle cx="620" cy="80"   r="18" fill="url(#rtkGlow)"/>
      <circle cx="655" cy="103"  r="18" fill="url(#rtkGlow)"/>
      <circle cx="542" cy="267"  r="18" fill="url(#rtkGlow)"/>
      <circle cx="660" cy="267"  r="18" fill="url(#rtkGlow)"/>
    </g>

    <!-- RTKs anchored on membrane (12 — more than untreated).
         Rotation = atan2(P.y - C.y, P.x - C.x) + 90, where C = (600, 190). -->
    <use href="#rtk" transform="translate(528,158) rotate(-66)"/>
    <use href="#rtk" transform="translate(538,222) rotate(-117)"/>
    <use href="#rtk" transform="translate(600,77)  rotate(0)"/>
    <use href="#rtk" transform="translate(600,303) rotate(180)"/>
    <use href="#rtk" transform="translate(670,140) rotate(55)"/>
    <use href="#rtk" transform="translate(667,238) rotate(126)"/>
    <use href="#rtk" transform="translate(538,117) rotate(-40)"/>
    <use href="#rtk" transform="translate(582,82)  rotate(-10)"/>
    <use href="#rtk" transform="translate(620,80)  rotate(10)"/>
    <use href="#rtk" transform="translate(655,103) rotate(32)"/>
    <use href="#rtk" transform="translate(542,267) rotate(-143)"/>
    <use href="#rtk" transform="translate(660,267) rotate(142)"/>

    <!-- Active RAS-GTP dots (FEW — RAS inhibited) -->
    <g fill="#C75050" opacity="0.5">
      <circle cx="594" cy="180" r="3"/>
      <circle cx="611" cy="200" r="3"/>
    </g>

    <!-- Inner labels -->
    <text x="600" y="175" text-anchor="middle" font-size="11"
          fill="#13294B" font-weight="600">↓ Active RAS-GTP</text>
    <text x="600" y="215" text-anchor="middle" font-size="11"
          fill="#2E6A9F" font-weight="600">↑ RTK upregulation</text>
  </g>

  <!-- ====================================================================
       FEEDBACK ARROW (curving from right cell back to left)
       ==================================================================== -->
  <g>
    <path d="M 600 52 C 600 4, 360 4, 200 92"
          fill="none" stroke="#2E6A9F" stroke-width="2.5"
          stroke-dasharray="6,4" marker-end="url(#arrowDeep)"/>
    <text x="400" y="11" text-anchor="middle" font-size="11" fill="#2E6A9F"
          font-style="italic" font-weight="500">
      Compensatory feedback: RTKs rise as RAS signaling drops
    </text>
  </g>

  <!-- ====================================================================
       BOTTOM CAPTION
       ==================================================================== -->
  <g>
    <line x1="40" y1="335" x2="680" y2="335" stroke="#E6EAEF" stroke-width="1"/>
    <text x="360" y="352" text-anchor="middle" font-size="12" fill="#13294B"
          font-weight="600">
      RTK upregulation is simultaneously a resistance mechanism and a rational combination target
    </text>
  </g>
</svg>
