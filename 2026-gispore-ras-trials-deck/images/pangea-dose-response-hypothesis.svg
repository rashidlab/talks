<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="PANGEA dose-response hypothesis">
  <title>PANGEA dose-response hypothesis</title>
  <desc>Schematic showing PANGEA's hypothesis: in combination with gemcitabine/nab-paclitaxel, erlotinib efficacy plateaus in the DL2-DL4 range and declines toward the full-label dose at DL6, while DLT rate rises monotonically with dose. The hypothesized OBD region (DL2-DL4) is shaded; the trial starts at DL3, well below the labeled MTD-logic dose.</desc>

  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 5, 0 10" fill="#13294B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="500" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="320" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#13294B">
    Hypothesis: efficacy peaks below the full-label dose
  </text>

  <!-- Plot group: origin at (80, 70) -->
  <g transform="translate(80, 70)">

    <!-- Hypothesized OBD region shading (behind curves) -->
    <rect x="80" y="20" width="240" height="320" fill="#F5C242" opacity="0.16"/>
    <text x="200" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="#8A6D1B" font-style="italic">
      Hypothesized OBD region
    </text>

    <!-- Y-axis -->
    <line x1="0" y1="20" x2="0" y2="340" stroke="#13294B" stroke-width="1.5"/>
    <text x="-52" y="180" text-anchor="middle" font-size="12" fill="#13294B" transform="rotate(-90 -52 180)">
      Rate (response · DLT)
    </text>
    <text x="-10" y="344" text-anchor="end" font-size="10" fill="#5B6670">low</text>
    <text x="-10" y="28" text-anchor="end" font-size="10" fill="#5B6670">high</text>

    <!-- X-axis -->
    <line x1="0" y1="340" x2="500" y2="340" stroke="#13294B" stroke-width="1.5"/>
    <text x="250" y="395" text-anchor="middle" font-size="12" fill="#13294B">Erlotinib dose level</text>

    <!-- X-axis tick marks -->
    <g stroke="#13294B" stroke-width="1">
      <line x1="40"  y1="340" x2="40"  y2="346"/>
      <line x1="120" y1="340" x2="120" y2="346"/>
      <line x1="200" y1="340" x2="200" y2="346"/>
      <line x1="280" y1="340" x2="280" y2="346"/>
      <line x1="360" y1="340" x2="360" y2="346"/>
      <line x1="440" y1="340" x2="440" y2="346"/>
    </g>

    <!-- X-axis labels: dose level + mg -->
    <g text-anchor="middle">
      <g font-size="11" font-weight="600" fill="#13294B">
        <text x="40"  y="362">DL1</text>
        <text x="120" y="362">DL2</text>
        <text x="200" y="362">DL3</text>
        <text x="280" y="362">DL4</text>
        <text x="360" y="362">DL5</text>
        <text x="440" y="362">DL6</text>
      </g>
      <g font-size="10" fill="#5B6670">
        <text x="40"  y="376">25 QOD</text>
        <text x="120" y="376">25 QD</text>
        <text x="200" y="376">50 QD</text>
        <text x="280" y="376">75 QD</text>
        <text x="360" y="376">100 QD</text>
        <text x="440" y="376">150 QD</text>
      </g>
    </g>

    <!-- DLT (toxicity) curve - monotone rising, dashed -->
    <path d="M 40,300 Q 120,278 200,250 Q 280,215 360,170 Q 400,148 440,128"
          fill="none" stroke="#B22222" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="370" y="123" font-size="12" font-weight="700" fill="#B22222">DLT rate</text>

    <!-- Efficacy (response) curve - rises, plateaus DL2-DL4, declines -->
    <path d="M 40,180 Q 100,95 200,80 Q 240,82 280,92 Q 340,150 440,215"
          fill="none" stroke="#4B9CD3" stroke-width="3.5"/>
    <text x="42" y="240" font-size="12" font-weight="700" fill="#4B9CD3">Response (erlotinib + GnP)</text>

    <!-- Full-label dose marker (DL6) - dashed vertical to highlight MTD-logic territory -->
    <line x1="440" y1="340" x2="440" y2="48" stroke="#13294B" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
    <text x="495" y="48" text-anchor="end" font-size="10" font-style="italic" fill="#13294B">Full label</text>
    <text x="495" y="61" text-anchor="end" font-size="10" font-style="italic" fill="#13294B">(MTD logic)</text>

    <!-- Starting dose marker (DL3) - prominent navy dot on efficacy curve -->
    <circle cx="200" cy="80" r="6.5" fill="#13294B" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Starting dose annotation: small callout box above plot, arrow down to the dot -->
    <rect x="153" y="-28" width="94" height="22" rx="3" fill="#FFFFFF" stroke="#13294B" stroke-width="1"/>
    <text x="200" y="-13" text-anchor="middle" font-size="11" font-weight="700" fill="#13294B">Trial starts at DL3</text>
    <line x1="200" y1="-6" x2="200" y2="72" stroke="#13294B" stroke-width="1.2" marker-end="url(#arrow-navy)"/>

  </g>

</svg>
