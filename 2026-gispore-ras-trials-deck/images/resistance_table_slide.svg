<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="90" font-size="44" font-weight="bold" fill="#14305B">Detecting resistance takes two reads, not one</text>
  <text x="64" y="132" font-size="22" fill="#5A6B7B">Different resistance mechanisms become visible through different assays.</text>
  <rect x="64" y="180" width="1152" height="62" fill="#14305B"/>
  <text x="92" y="219" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">RESISTANCE TYPE</text>
  <text x="640" y="219" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">WHAT YOU NEED TO MEASURE IT</text>
  <rect x="64" y="242" width="1152" height="118" fill="#F2F5F8"/>
  <rect x="64" y="242" width="6" height="118" fill="#4A90C2"/>
  <text x="92" y="290" font-size="24" font-weight="bold" fill="#14305B">Genomic</text>
  <text x="92" y="324" font-size="19" fill="#5A6B7B">KRAS amplification, NRAS / BRAF / MAP2K1 alterations</text>
  <rect x="640" y="272" width="150" height="56" rx="28" fill="#14305B"/>
  <text x="715" y="307" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ctDNA</text>
  <text x="815" y="307" font-size="19" fill="#5A6B7B" font-style="italic">serial liquid biopsy, minimally invasive</text>
  <rect x="64" y="372" width="1152" height="118" fill="#FFFFFF"/>
  <rect x="64" y="372" width="6" height="118" fill="#7FB2D6"/>
  <text x="92" y="420" font-size="24" font-weight="bold" fill="#14305B">Cell-state / plasticity</text>
  <text x="92" y="454" font-size="19" fill="#5A6B7B">basal-to-classical switching, partial EMT</text>
  <rect x="640" y="402" width="430" height="56" rx="28" fill="#4A90C2"/>
  <text x="855" y="437" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">biopsy + transcriptomics + imaging</text>
  <line x1="64" y1="490" x2="1216" y2="490" stroke="#E2E8ED" stroke-width="2"/>
  <rect x="64" y="540" width="1152" height="86" rx="6" fill="#14305B"/>
  <text x="640" y="580" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A resistance-aware trial has to run both, during enrollment, not at progression.</text>
  <text x="640" y="610" font-size="19" fill="#9DBDD6" text-anchor="middle" font-style="italic">Genomic and cell-state resistance are invisible to each other's assay.</text>
</svg>
