<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="64" y="74" font-size="40" font-weight="bold" fill="#14305B">Same architecture, different disease</text>
  <text x="64" y="112" font-size="21" fill="#5A6B7B">The EVOLVE-BDT flow is reusable: only the biomarker and the drugs change.</text>

  <!-- Column legend chips -->
  <rect x="64" y="140" width="18" height="18" rx="3" fill="#4A90C2"/>
  <text x="90" y="155" font-size="17" font-weight="bold" fill="#4A90C2">EVOLVE-BDT — breast (real, enrolling)</text>
  <rect x="560" y="140" width="18" height="18" rx="3" fill="#C0712E"/>
  <text x="586" y="155" font-size="17" font-weight="bold" fill="#C0712E">PDAC analog (PurIST-defined, hypothetical)</text>

  <!-- ============ ARCHITECTURE SPINE (4 stages) ============ -->
  <!-- stage boxes are the shared skeleton in slate; annotations branch above (breast) and below (PDAC) -->

  <!-- Stage 1 -->
  <rect x="80" y="330" width="220" height="80" rx="8" fill="#5A6B7B"/>
  <text x="190" y="362" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Subgroup</text>
  <text x="190" y="384" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">determination</text>
  <text x="190" y="403" font-size="13" fill="#C9D2DA" text-anchor="middle" font-style="italic">at enrollment, by biopsy</text>

  <!-- Stage 2 -->
  <rect x="360" y="330" width="220" height="80" rx="8" fill="#5A6B7B"/>
  <text x="470" y="362" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Subgroup-stratified</text>
  <text x="470" y="384" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">adaptive randomization</text>
  <text x="470" y="403" font-size="13" fill="#C9D2DA" text-anchor="middle" font-style="italic">Bayesian, within subtype</text>

  <!-- Stage 3 -->
  <rect x="640" y="330" width="220" height="80" rx="8" fill="#14305B"/>
  <text x="750" y="362" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Arm replacement</text>
  <text x="750" y="384" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">on futility / efficacy</text>
  <text x="750" y="403" font-size="13" fill="#9DBDD6" text-anchor="middle" font-style="italic">losing arms swapped out</text>

  <!-- Stage 4 -->
  <rect x="920" y="330" width="220" height="80" rx="8" fill="#5A6B7B"/>
  <text x="1030" y="362" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Re-subgroup at</text>
  <text x="1030" y="384" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">progression</text>
  <text x="1030" y="403" font-size="13" fill="#C9D2DA" text-anchor="middle" font-style="italic">liquid bx, next line</text>

  <!-- spine arrows -->
  <g fill="#B8C2CC">
    <polygon points="302,364 348,364 348,357 362,370 348,383 348,376 302,376"/>
    <polygon points="582,364 628,364 628,357 642,370 628,383 628,376 582,376"/>
    <polygon points="862,364 908,364 908,357 922,370 908,383 908,376 862,376"/>
  </g>

  <!-- feedback loop from stage 4 back to stage 2 (re-randomize) -->
  <path d="M 1030,410 L 1030,440 L 470,440 L 470,414" fill="none" stroke="#14305B" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="470,416 464,428 476,428" fill="#14305B"/>
  <text x="750" y="433" font-size="14" font-style="italic" fill="#14305B" text-anchor="middle">re-randomize to available arms on emerging biology</text>

  <!-- ============ BREAST annotations ABOVE spine ============ -->
  <!-- connectors -->
  <g stroke="#4A90C2" stroke-width="1.5" stroke-dasharray="3,3">
    <line x1="190" y1="330" x2="190" y2="250"/>
    <line x1="470" y1="330" x2="470" y2="250"/>
    <line x1="750" y1="330" x2="750" y2="250"/>
  </g>
  <rect x="90" y="200" width="200" height="50" rx="6" fill="#EAF2F8"/>
  <text x="190" y="222" font-size="15" font-weight="bold" fill="#14305B" text-anchor="middle">ER+/HER2- and TNBC</text>
  <text x="190" y="240" font-size="13" fill="#5A6B7B" text-anchor="middle">ESR1 / PI3K subgroups A-D</text>

  <rect x="372" y="200" width="196" height="50" rx="6" fill="#EAF2F8"/>
  <text x="470" y="222" font-size="14" font-weight="bold" fill="#14305B" text-anchor="middle">FUL/elacestrant +</text>
  <text x="470" y="240" font-size="13" fill="#5A6B7B" text-anchor="middle">CDK4/6i, everolimus, CAPI</text>

  <rect x="652" y="200" width="196" height="50" rx="6" fill="#EAF2F8"/>
  <text x="750" y="222" font-size="14" font-weight="bold" fill="#14305B" text-anchor="middle">Bayesian arm-swap</text>
  <text x="750" y="240" font-size="13" fill="#5A6B7B" text-anchor="middle">on futility / efficacy</text>

  <!-- ============ PDAC annotations BELOW spine ============ -->
  <g stroke="#C0712E" stroke-width="1.5" stroke-dasharray="3,3">
    <line x1="190" y1="410" x2="190" y2="490"/>
    <line x1="470" y1="455" x2="470" y2="490"/>
    <line x1="750" y1="410" x2="750" y2="490"/>
  </g>
  <rect x="90" y="490" width="200" height="50" rx="6" fill="#FBEFE3"/>
  <text x="190" y="512" font-size="15" font-weight="bold" fill="#8A4B12" text-anchor="middle">Basal-like vs classical</text>
  <text x="190" y="530" font-size="13" fill="#A6692E" text-anchor="middle">by PurIST</text>

  <rect x="372" y="490" width="196" height="50" rx="6" fill="#FBEFE3"/>
  <text x="470" y="512" font-size="14" font-weight="bold" fill="#8A4B12" text-anchor="middle">Daraxonrasib +</text>
  <text x="470" y="530" font-size="13" fill="#A6692E" text-anchor="middle">GnP combination arms</text>

  <rect x="652" y="490" width="196" height="50" rx="6" fill="#FBEFE3"/>
  <text x="750" y="512" font-size="14" font-weight="bold" fill="#8A4B12" text-anchor="middle">Same arm-swap logic</text>
  <text x="750" y="530" font-size="13" fill="#A6692E" text-anchor="middle">on resistance biology</text>

  <!-- ============ takeaway band ============ -->
  <rect x="64" y="600" width="1152" height="74" rx="6" fill="#F2F5F8"/>
  <rect x="64" y="600" width="6" height="74" fill="#C0712E"/>
  <text x="640" y="634" font-size="22" font-weight="bold" fill="#14305B" text-anchor="middle">The same adaptive framework applies to PurIST-defined PDAC subtypes and evolving resistance biology.</text>
  <text x="640" y="661" font-size="16" fill="#5A6B7B" text-anchor="middle">Swap the biomarker and the drugs; the calibration machinery and decision rules carry over.</text>
</svg>
